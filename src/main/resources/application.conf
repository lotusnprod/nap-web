ktor {
    deployment {
        port = 8080
        port = ${?PORT}
        # Give in-flight requests (bounded by the 15s SPARQL timeout) a chance to
        # finish instead of Netty's 1s/5s defaults cutting them mid-render.
        shutdownGracePeriod = 5000
        shutdownTimeout = 20000
    }
    application {
        modules = [ net.nprod.nap.ApplicationKt.module ]
    }
}
