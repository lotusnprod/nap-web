name: nap

x-restart-defaults: &restart
  restart: unless-stopped

services:
  nap-sparql:
    build:
      context: stack/fuseki
    <<: *restart
    environment:
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set - copy .env.example to .env}"
      ENABLE_DATA_WRITE: "false"
      ENABLE_UPDATE: "false"
      ENABLE_SHACL: "false"
      QUERY_TIMEOUT: "${QUERY_TIMEOUT:-600000}"
      # The entrypoint seeds /seed into the store before starting Fuseki. Idempotent:
      # skipped when the store already has data. FORCE_SEED wipes and reloads;
      # SEED_ENABLED=false refuses to touch the store at all.
      FORCE_SEED: "${FORCE_SEED:-false}"
      SEED_ENABLED: "${SEED_ENABLED:-true}"
    volumes:
      - nap-data:/databases
      - ./stack/seed:/seed:ro
    networks: [nap]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- 'http://localhost:3030/$$/ping' >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s

  nap-web:
    build:
      context: ./
    <<: *restart
    environment:
      SPARQL_SERVER: "http://nap-sparql:3030/raw/sparql"
      ENVIRONMENT: "${ENVIRONMENT:-production}"
      HTTP_AUTH_SPARQL_USER: "${HTTP_AUTH_SPARQL_USER:-}"
      HTTP_AUTH_SPARQL_PASSWORD: "${HTTP_AUTH_SPARQL_PASSWORD:-}"
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    networks: [nap]
    depends_on:
      nap-sparql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 45s

volumes:
  nap-data:

networks:
  nap:
    driver: bridge
