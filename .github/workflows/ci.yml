name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'

    # The committed gradle-wrapper.jar is a genuine Gradle 7.1-7.3 artifact (verified
    # 2026-08-23 against the official checksums). Nothing was checking that, so a swapped
    # jar would have executed unnoticed on every build.
    - name: Validate Gradle wrapper
      uses: gradle/actions/wrapper-validation@v4

    # Replaces the hand-rolled actions/cache: setup-gradle handles the dependency cache,
    # the configuration cache and build scans, and writes a job summary.
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        cache-read-only: ${{ github.ref != 'refs/heads/main' }}

    - name: Run tests
      run: ./gradlew test

    - name: Generate coverage report
      run: ./gradlew koverXmlReport koverHtmlReport

    - name: Build application
      run: ./gradlew build

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: build/reports/tests/test/

    - name: Upload build reports
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: build-reports
        path: build/reports/

    - name: Upload coverage reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: coverage-reports
        path: |
          build/reports/kover/
          build/reports/kover/html/
          build/reports/kover/xml/

  # Dependabot cannot see a Gradle graph on its own, which is why the nine Netty CVEs
  # (transitive through ktor-server-netty) never raised an alert. This publishes the
  # resolved graph so the alerts actually fire.
  dependency-submission:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
    - uses: gradle/actions/dependency-submission@v4
