# Auto-loaded by `docker compose` / `podman-compose`, so local development is the
# default. Production explicitly selects -f docker-compose.yml -f docker-compose.prod.yml.
services:
  nap-sparql:
    ports:
      # Fuseki UI, for local poking. Override FUSEKI_PORT if 3030 is taken.
      - "127.0.0.1:${FUSEKI_PORT:-3030}:3030"

  nap-web:
    environment:
      ENVIRONMENT: "development"
